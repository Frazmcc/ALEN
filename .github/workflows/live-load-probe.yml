name: Live API load probe

on:
  workflow_dispatch:
  push:
    branches:
      - perf/live-load-probe
    paths:
      - scripts/live_load_probe.py
      - .github/workflows/live-load-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install probe dependency
        run: python -m pip install "httpx>=0.27,<1"

      - name: Run controlled 25/50/100-user probe
        run: python scripts/live_load_probe.py
