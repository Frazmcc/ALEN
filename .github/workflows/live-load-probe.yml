name: Live API load probe

on:
  workflow_dispatch:
  push:
    branches:
      - perf/live-load-probe
    paths:
      - scripts/live_load_probe.py
      - .github/workflows/live-load-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install probe dependency
        run: python -m pip install "httpx>=0.27,<1"

      - name: Run controlled 25/50/100-user probe
        run: python scripts/live_load_probe.py
