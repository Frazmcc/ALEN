name: Deploy hosted web to GitHub Pages

on:
  workflow_run:
    workflows:
      - CodeQL
    types:
      - completed

permissions:
  contents: read
  checks: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Verify all required CI checks passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/check-runs?per_page=100" \
              > /tmp/checks.json

            result="$(python -c 'import json; from pathlib import Path; payload=json.loads(Path("/tmp/checks.json").read_text(encoding="utf-8")); checks={item["name"]:item for item in payload.get("check_runs",[])}; required=("test","Analyze Python and JavaScript"); pending=[name for name in required if name not in checks or checks[name].get("status")!="completed"]; failed=[f"{name}={checks[name].get('"'"'conclusion'"'"')}" for name in required if name in checks and checks[name].get("status")=="completed" and checks[name].get("conclusion")!="success"]; print("FAILED:"+",".join(failed) if failed else "PENDING:"+",".join(pending) if pending else "PASS")')"

            echo "CI gate attempt $attempt for $DEPLOY_SHA: $result"

            if [[ "$result" == "PASS" ]]; then
              break
            fi

            if [[ "$result" == FAILED:* ]]; then
              echo "Required CI check failed: ${result#FAILED:}" >&2
              exit 1
            fi

            if [[ "$attempt" -eq 60 ]]; then
              echo "Timed out waiting for required CI checks: ${result#PENDING:}" >&2
              exit 1
            fi

            sleep 5
          done

      - name: Checkout exact validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare static web artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          cp -R web _site
          printf '{"git_commit":"%s"}\n' "$DEPLOY_SHA" > _site/build.json

      - name: Upload static web artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
