name: Deploy hosted web to GitHub Pages

on:
  workflow_run:
    workflows: ["CodeQL"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success'
        )
      }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Verify all required CI checks passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error               --header "Accept: application/vnd.github+json"               --header "Authorization: Bearer $GH_TOKEN"               --header "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/check-runs?per_page=100"               > /tmp/checks.json

            result="$(python - <<'PY'
import json
from pathlib import Path

payload = json.loads(Path("/tmp/checks.json").read_text(encoding="utf-8"))
checks = {item["name"]: item for item in payload.get("check_runs", [])}
required = ("test", "Analyze Python and JavaScript")

pending = []
failed = []
for name in required:
    check = checks.get(name)
    if not check or check.get("status") != "completed":
        pending.append(name)
    elif check.get("conclusion") != "success":
        failed.append(f"{name}={check.get('conclusion')}")

if failed:
    print("FAILED:" + ",".join(failed))
elif pending:
    print("PENDING:" + ",".join(pending))
else:
    print("PASS")
PY
)"

            echo "CI gate attempt $attempt for $DEPLOY_SHA: $result"

            if [[ "$result" == "PASS" ]]; then
              break
            fi
            if [[ "$result" == FAILED:* ]]; then
              echo "Required CI check failed: ${result#FAILED:}" >&2
              exit 1
            fi
            if [[ "$attempt" -eq 60 ]]; then
              echo "Timed out waiting for required CI checks: ${result#PENDING:}" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Checkout exact validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare static web artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          cp -R web _site
          printf '{"git_commit":"%s"}\n' "$DEPLOY_SHA" > _site/build.json

      - name: Upload static web artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
