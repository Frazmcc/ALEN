name: Live website smoke probe

on:
  workflow_run:
    workflows:
      - Deploy hosted web to GitHub Pages
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: live-web-smoke
  cancel-in-progress: true

jobs:
  probe:
    if: github.event.workflow_run.conclusion == 'success'
    name: Probe production website
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      SITE_BASE: https://frazmcc.github.io/ALEN
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Wait for exact website commit
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --location --connect-timeout 5 --max-time 12 \
              --output /tmp/build.json --write-out '%{http_code}' "$SITE_BASE/build.json" || true)"

            deployed=""
            if [[ "$status" == "200" ]]; then
              deployed="$(python -c 'import json; from pathlib import Path; p=Path("/tmp/build.json"); print(json.loads(p.read_text(encoding="utf-8")).get("git_commit",""))' 2>/dev/null || true)"
            fi

            echo "Attempt $attempt: HTTP=$status deployed=${deployed:-unknown} expected=$EXPECTED_SHA"

            if [[ "$status" == "200" && "$deployed" == "$EXPECTED_SHA" ]]; then
              break
            fi

            if [[ "$attempt" -eq 30 ]]; then
              echo "ALEN website did not expose expected commit $EXPECTED_SHA." >&2
              exit 1
            fi

            sleep 5
          done

      - name: Probe website document
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --connect-timeout 5 --max-time 12 \
            "$SITE_BASE/" > /tmp/index.html
          grep -Fq "Astronomical Live Environment &amp; Navigation" /tmp/index.html
          grep -Fq "Content-Security-Policy" /tmp/index.html
