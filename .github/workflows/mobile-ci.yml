name: Mobile CI

concurrency:
  group: mobile-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Decoder security regression
        run: node --test tests/query-string-security.test.cjs

      - name: Expo doctor
        run: npm run doctor

      - name: Type check
        run: npm run typecheck
